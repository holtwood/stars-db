# 每日自动同步 GitHub Star 数据并重新生成索引
#
# 首次使用前,请配置仓库 Secret:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  STARS_TOKEN
#   Value: 你的 GitHub Personal Access Token(需 stars 读取权限)
#          参见 https://github.com/settings/tokens
#   (GITHUB_TOKEN 无法读取 Star Lists,必须用 PAT)

name: Sync Stars

on:
  schedule:
    # 每天 UTC 03:17 自动同步(避开整点,降低 API 峰值)
    - cron: '17 3 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch stars
        env:
          GH_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: bash scripts/fetch_stars.sh

      - name: Fetch star lists
        env:
          GH_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: python3 scripts/fetch_lists.py

      - name: Generate index
        run: python3 scripts/gen_index.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '✅ 数据无变化,跳过提交'
          else
            git commit -m '🔄 自动同步 Star 数据'
            git push
          fi
